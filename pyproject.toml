[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashcard-app"
version = "0.1.0"
description = "A flashcard learning app with spaced repetition (SM-2 algorithm)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
flashcards = "flashcard_app.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/flashcard-app"
